name: Build Team21 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Team21-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── SIGNED RELEASE BUILD (only runs if secrets are set) ──────
      - name: Build Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/team21.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/team21.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      - name: Upload Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: Team21-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── AUTO-CREATE GITHUB RELEASE on version tags ───────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          name: Team21 AE Platform ${{ github.ref_name }}
          body: |
            ## Team21 AE Consulting — Unified Excellence Platform
            **Version:** ${{ github.ref_name }}
            **© Innocent Forteh — Team21 Academy 2026**

            ### What's included
            - AE Consulting Module (8 assessment modules)
            - 360° Evaluation Module (8 competency sections)
            - LAT — Leadership Assessment Tool (6 domains)
            - Full Admin Portal

            ### Install
            Download `app-release.apk` (signed) or `app-debug.apk` (unsigned/testing).
            Enable "Install from unknown sources" on your Android device before installing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
